name: Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify tag and project versions
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          [xml]$props = Get-Content -LiteralPath Directory.Build.props
          $projectVersion = [string]$props.Project.PropertyGroup.Version
          $installerVersion = (Select-String -LiteralPath installer.iss -Pattern '^#define MyAppVersion "([^"]+)"$').Matches[0].Groups[1].Value
          [xml]$identityManifest = Get-Content -LiteralPath packaging\AppxManifest.xml
          $identityVersion = ([string]$identityManifest.Package.Identity.Version) -replace '\.0$', ''
          [xml]$appManifest = Get-Content -LiteralPath src\sZIP.App\app.manifest
          $appVersion = ([string]$appManifest.assembly.assemblyIdentity.version) -replace '\.0$', ''
          $appMsix = $appManifest.assembly.msix
          if ($version -ne $projectVersion -or $version -ne $installerVersion -or
              $version -ne $identityVersion -or $version -ne $appVersion) {
            throw "Version mismatch: tag=$version project=$projectVersion installer=$installerVersion identity=$identityVersion app=$appVersion"
          }
          if ($appMsix) {
            throw "The app must launch independently of the optional Explorer identity package."
          }

      - name: Prepare matching source assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $source = "artifacts\sZIP-$version-source.zip"
          & git archive --format=zip "--prefix=sZIP-$version-source/" "--output=$source" HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $source)) {
            throw "Could not create the source archive for $tag."
          }
          $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          "$sourceHash  $([IO.Path]::GetFileName($source))" |
            Set-Content -Encoding ascii -LiteralPath "$source.sha256"
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($commit)) {
            throw "Could not determine the source commit."
          }
          $dotnetVersion = (& dotnet --version).Trim()
          $buildInfo = @"
          # sZIP $version source and build information

          ## Source

          - Release tag: $tag
          - Source commit: $commit
          - Matching source archive: sZIP-$version-source.zip

          ## Dependencies

          - SharpCompress 0.50.1: https://github.com/adamhathcock/sharpcompress
          - Microsoft.Bcl.AsyncInterfaces 8.0.0: https://www.nuget.org/packages/Microsoft.Bcl.AsyncInterfaces/8.0.0
          - System.Buffers 4.6.1: https://www.nuget.org/packages/System.Buffers/4.6.1
          - System.Memory 4.6.3: https://www.nuget.org/packages/System.Memory/4.6.3
          - System.Runtime.CompilerServices.Unsafe 6.1.2: https://www.nuget.org/packages/System.Runtime.CompilerServices.Unsafe/6.1.2
          - System.Text.Encoding.CodePages 8.0.0: https://www.nuget.org/packages/System.Text.Encoding.CodePages/8.0.0
          - System.Threading.Tasks.Extensions 4.5.4: https://www.nuget.org/packages/System.Threading.Tasks.Extensions/4.5.4
          - Dependency license details: THIRD-PARTY-NOTICES.md in the source archive

          ## Build

          - Platform: Windows x64
          - .NET SDK: $dotnetVersion
          - Framework: .NET Framework 4.8
          - Native build: MSBuild with the Visual C++ x64 toolchain
          - Installer: Inno Setup 6
          - Main build commands: dotnet test sZIP.sln --configuration Release, dotnet publish src\sZIP.App\sZIP.App.csproj --configuration Release, and the native shell extension MSBuild command
          "@
          $buildInfo.Trim() | Set-Content -Encoding utf8 -LiteralPath "artifacts\sZIP-$version-build-info.md"

      - name: Restore dependencies
        run: dotnet restore sZIP.sln

      - name: Run tests
        run: dotnet test sZIP.sln --configuration Release --no-restore

      - name: Publish portable application
        run: dotnet publish src\sZIP.App\sZIP.App.csproj --configuration Release --output artifacts\publish --no-restore

      - name: Build Windows 11 context menu extension
        shell: pwsh
        run: msbuild src\sZIP.ShellExtension\sZIP.ShellExtension.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Test portable application startup
        shell: pwsh
        run: .\tests\Verify-AppStartup.ps1 -ExecutablePath artifacts\publish\sZIP.App.exe

      - name: Build sparse identity package
        shell: pwsh
        run: .\build_identity_package.ps1 artifacts\publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Test Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = Resolve-Path -LiteralPath "artifacts\sZIP_Setup_$version.exe"
          $testInstaller = Join-Path $env:RUNNER_TEMP "sZIP_Setup_$version.exe"
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\sZIP Startup Test"
          $installLog = Join-Path $env:RUNNER_TEMP "szip-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "szip-uninstall.log"
          Copy-Item -LiteralPath $installer -Destination $testInstaller -Force

          $install = Start-Process -FilePath $testInstaller -Wait -PassThru -WindowStyle Hidden -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/MERGETASKS=!desktopicon,!startup,!shellintegration",
            "/DIR=`"$installRoot`"",
            "/DELETEINSTALLER=`"$testInstaller`"",
            "/LOG=`"$installLog`""
          )
          if ($install.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installLog) { Get-Content -LiteralPath $installLog }
            throw "Installer exited with code $($install.ExitCode)"
          }

          $app = Join-Path $installRoot "sZIP.App.exe"
          if (-not (Test-Path -LiteralPath $app)) {
            if (Test-Path -LiteralPath $installLog) { Get-Content -LiteralPath $installLog }
            throw "Installed app was not found: $app"
          }

          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($app).FileVersion
          if (-not $fileVersion.StartsWith("$version.")) {
            throw "Installed app version mismatch: expected $version, got $fileVersion"
          }

          .\tests\Verify-AppStartup.ps1 -ExecutablePath $app

          .\tests\Verify-AppStartup.ps1 -ExecutablePath $app -NormalStartup

          # Also exercise startup after optional Explorer registration was attempted.
          $registration = Start-Process -FilePath $app -ArgumentList '--register-shell' -WindowStyle Hidden -PassThru
          if (-not $registration.WaitForExit(60000)) {
            $registration.Kill()
            throw 'Explorer registration timed out.'
          }
          if ($registration.ExitCode -ne 0) { throw "Explorer registration process failed: $($registration.ExitCode)" }
          .\tests\Verify-AppStartup.ps1 -ExecutablePath $app

          .\tests\Verify-AppStartup.ps1 -ExecutablePath $app -NormalStartup

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) {
            throw "Uninstaller was not found: $uninstaller"
          }

          $uninstall = Start-Process -FilePath $uninstaller -Wait -PassThru -WindowStyle Hidden -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=`"$uninstallLog`""
          )
          if ($uninstall.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $uninstallLog) { Get-Content -LiteralPath $uninstallLog }
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }
          if (Test-Path -LiteralPath $app) {
            throw "Installed app still exists after uninstall: $app"
          }

          for ($i = 0; $i -lt 15 -and (Test-Path -LiteralPath $testInstaller); $i++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $testInstaller) {
            throw "Temporary installer still exists after install cleanup: $testInstaller"
          }

      - name: Create release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = "artifacts\sZIP_Setup_$version.exe"
          $portable = "artifacts\sZIP-$version-net48.zip"
          Compress-Archive -Path artifacts\publish\* -DestinationPath $portable -CompressionLevel Optimal
          foreach ($asset in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))" | Set-Content -Encoding ascii -LiteralPath "$asset.sha256"
          }
          $latestInstaller = "artifacts\sZIP_Setup_latest.exe"
          Copy-Item -LiteralPath $installer -Destination $latestInstaller -Force
          $latestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $latestInstaller).Hash.ToLowerInvariant()
          "$latestHash  sZIP_Setup_latest.exe" | Set-Content -Encoding ascii -LiteralPath "$latestInstaller.sha256"

      - name: Verify release assets
        shell: pwsh
        run: .\tests\Verify-ReleaseAssets.ps1 -ArtifactsDirectory artifacts -Version $env:GITHUB_REF_NAME.TrimStart("v")

      - name: Preserve release assets
        uses: actions/upload-artifact@v6
        with:
          name: sZIP-${{ github.ref_name }}-windows
          path: |
            artifacts/sZIP_Setup_*.exe
            artifacts/sZIP_Setup_*.exe.sha256
            artifacts/sZIP-*.zip
            artifacts/sZIP-*.zip.sha256
            artifacts/sZIP-*-source.zip
            artifacts/sZIP-*-source.zip.sha256
            artifacts/sZIP-*-build-info.md
          compression-level: 0

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $releaseNotes = @(
            "<!-- sZIP:lang=en -->"
            (Get-Content -LiteralPath RELEASE_NOTES.md -Raw).Trim()
            ""
            "<!-- sZIP:lang=ko -->"
            (Get-Content -LiteralPath RELEASE_NOTES.ko.md -Raw).Trim()
          ) -join [Environment]::NewLine
          $releaseNotes | Set-Content -LiteralPath artifacts\RELEASE_NOTES.md -Encoding utf8
          gh release create $tag `
            "artifacts\sZIP_Setup_$version.exe" `
            "artifacts\sZIP_Setup_$version.exe.sha256" `
            "artifacts\sZIP_Setup_latest.exe" `
            "artifacts\sZIP_Setup_latest.exe.sha256" `
            "artifacts\sZIP-$version-net48.zip" `
            "artifacts\sZIP-$version-net48.zip.sha256" `
            "artifacts\sZIP-$version-source.zip" `
            "artifacts\sZIP-$version-source.zip.sha256" `
            "artifacts\sZIP-$version-build-info.md" `
            --verify-tag `
            --title "sZIP $version" `
            --draft `
            --notes-file artifacts\RELEASE_NOTES.md

      - name: Verify uploaded release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $release = gh release view $tag --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if (-not $release.isDraft -or $release.isPrerelease) {
            throw "The release must remain a non-prerelease draft until all assets are verified."
          }
          $required = @(
            "sZIP_Setup_$version.exe",
            "sZIP_Setup_latest.exe",
            "sZIP-$version-source.zip",
            "sZIP-$version-source.zip.sha256",
            "sZIP-$version-build-info.md"
          )
          $actual = @($release.assets | ForEach-Object name)
          foreach ($name in $required) {
            if ($actual -notcontains $name) { throw "Published release is missing asset: $name" }
          }

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --prerelease=false

      - name: Verify published release structure
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $release = gh release view $tag --json isDraft,isPrerelease | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "The published release must be a public stable release."
          }
