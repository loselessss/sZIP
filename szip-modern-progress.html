<div id="szip-progress-mockup">
  <style>
    #szip-progress-mockup {
      color-scheme: light dark;
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      color: light-dark(#1c2430, #edf2f7);
      padding: 12px 0;
    }
    #szip-progress-mockup .szip-window {
      box-sizing: border-box;
      overflow: hidden;
      background: light-dark(#f7f9fc, #151a22);
      border: 1px solid light-dark(#dce2ea, #303846);
      border-radius: 14px;
      box-shadow: 0 18px 50px light-dark(rgba(42, 57, 78, .16), rgba(0, 0, 0, .34));
    }
    #szip-progress-mockup .szip-titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 0 16px;
      background: light-dark(#ffffff, #1c222c);
      border-bottom: 1px solid light-dark(#e5e9ef, #303846);
    }
    #szip-progress-mockup .szip-appmark {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 7px;
      background: light-dark(#356ae6, #78a5ff);
      color: light-dark(#ffffff, #0d1628);
      font-weight: 500;
    }
    #szip-progress-mockup .szip-appname { font-weight: 500; }
    #szip-progress-mockup .szip-titlemeta {
      margin-left: auto;
      color: light-dark(#687386, #9da9ba);
    }
    #szip-progress-mockup .szip-content { padding: 24px; }
    #szip-progress-mockup .szip-heading {
      display: flex;
      align-items: flex-start;
      gap: 15px;
    }
    #szip-progress-mockup .szip-fileicon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: light-dark(#e8efff, #243354);
      color: light-dark(#295ecf, #9bbcff);
    }
    #szip-progress-mockup .szip-copy { min-width: 0; flex: 1; }
    #szip-progress-mockup .szip-copy h2 {
      margin: 1px 0 5px;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 500;
    }
    #szip-progress-mockup .szip-filename {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: light-dark(#687386, #9da9ba);
    }
    #szip-progress-mockup .szip-percent {
      color: light-dark(#295ecf, #9bbcff);
      font-size: 22px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    #szip-progress-mockup .szip-track {
      height: 8px;
      margin: 21px 0 11px;
      overflow: hidden;
      border-radius: 999px;
      background: light-dark(#dfe5ed, #313a48);
    }
    #szip-progress-mockup .szip-fill {
      width: 68%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, light-dark(#356ae6, #78a5ff), light-dark(#55a0ff, #9ec5ff));
      transition: width .35s ease;
    }
    #szip-progress-mockup .szip-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: light-dark(#687386, #9da9ba);
      font-variant-numeric: tabular-nums;
    }
    #szip-progress-mockup .szip-details strong {
      color: light-dark(#1c2430, #edf2f7);
      font-weight: 500;
    }
    #szip-progress-mockup .szip-current {
      margin-top: 22px;
      padding: 13px 15px;
      border-radius: 10px;
      background: light-dark(#ffffff, #1c222c);
      border: 1px solid light-dark(#e5e9ef, #303846);
    }
    #szip-progress-mockup .szip-current-label {
      margin-bottom: 4px;
      color: light-dark(#687386, #9da9ba);
    }
    #szip-progress-mockup .szip-current-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #szip-progress-mockup .szip-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 22px;
    }
    #szip-progress-mockup button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 15px;
      border: 1px solid light-dark(#cfd6e0, #3a4453);
      border-radius: 8px;
      background: light-dark(#ffffff, #232a35);
      color: light-dark(#253044, #edf2f7);
      font: inherit;
      cursor: pointer;
    }
    #szip-progress-mockup button:hover { background: light-dark(#f0f4f9, #2b3441); }
    #szip-progress-mockup button.szip-primary {
      border-color: light-dark(#356ae6, #78a5ff);
      background: light-dark(#356ae6, #78a5ff);
      color: light-dark(#ffffff, #0d1628);
    }
    @media (max-width: 480px) {
      #szip-progress-mockup .szip-content { padding: 18px; }
      #szip-progress-mockup .szip-heading { flex-wrap: wrap; }
      #szip-progress-mockup .szip-percent { margin-left: 61px; }
      #szip-progress-mockup .szip-actions button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #szip-progress-mockup .szip-fill { transition: none; }
    }
  </style>

  <section class="szip-window" aria-label="sZIP 현대적인 압축 해제 진행 화면 예시">
    <header class="szip-titlebar">
      <span class="szip-appmark">S</span>
      <span class="szip-appname">sZIP</span>
      <span class="szip-titlemeta">압축 풀기</span>
    </header>

    <main class="szip-content">
      <div class="szip-heading">
        <div class="szip-fileicon"><i data-lucide="archive" aria-hidden="true"></i></div>
        <div class="szip-copy">
          <h2 id="szip-status-heading">압축을 풀고 있습니다</h2>
          <div class="szip-filename">project-resources-2026.zip</div>
        </div>
        <div class="szip-percent" id="szip-percent">68%</div>
      </div>

      <div class="szip-track" role="progressbar" aria-label="압축 해제 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
        <div class="szip-fill" id="szip-fill"></div>
      </div>

      <div class="szip-details">
        <span><strong>842 MB</strong> / 1.24 GB</span>
        <span><strong>84.7 MB/s</strong></span>
        <span>약 <strong>5초</strong> 남음</span>
      </div>

      <div class="szip-current">
        <div class="szip-current-label">현재 파일</div>
        <div class="szip-current-name">assets/photos/site-inspection-042.jpg</div>
      </div>

      <div class="szip-actions">
        <button type="button" id="szip-cancel"><i data-lucide="x" aria-hidden="true"></i>취소</button>
        <button type="button" class="szip-primary" id="szip-pause" aria-pressed="false"><i data-lucide="pause" aria-hidden="true"></i><span>일시 정지</span></button>
      </div>
    </main>
  </section>

  <script>
    (() => {
      const root = document.getElementById('szip-progress-mockup');
      const pause = root.querySelector('#szip-pause');
      const cancel = root.querySelector('#szip-cancel');
      const heading = root.querySelector('#szip-status-heading');
      const fill = root.querySelector('#szip-fill');
      const percent = root.querySelector('#szip-percent');
      const track = root.querySelector('[role="progressbar"]');
      pause.addEventListener('click', () => {
        const paused = pause.getAttribute('aria-pressed') !== 'true';
        pause.setAttribute('aria-pressed', String(paused));
        pause.querySelector('span').textContent = paused ? '계속' : '일시 정지';
        pause.querySelector('i')?.setAttribute('data-lucide', paused ? 'play' : 'pause');
        heading.textContent = paused ? '압축 해제를 잠시 멈췄습니다' : '압축을 풀고 있습니다';
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      });
      cancel.addEventListener('click', () => {
        fill.style.width = '0%';
        percent.textContent = '취소됨';
        track.setAttribute('aria-valuenow', '0');
        heading.textContent = '압축 해제를 취소했습니다';
        pause.disabled = true;
        cancel.disabled = true;
      });
    })();
  </script>
</div>
